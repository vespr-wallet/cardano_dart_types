targets:
  $default:
    builders:
      json_serializable:
        options:
          # Options configure how source code is generated for every
          # `@JsonSerializable`-annotated class in the package.
          #
          # The default value for each is listed.
          any_map: true
      freezed:
        options:
          # copy_with: false
          # equal: false
          format: false
          map: false
          when: false
      source_gen:combining_builder:
        options:
          # The generators format their output at 80 columns, but this repo
          # formats at 120 (analysis_options.yaml). The marker makes
          # `dart format` keep the generated layout, so CI's format check
          # passes on freshly generated files.
          preamble: "// dart format width=80"
